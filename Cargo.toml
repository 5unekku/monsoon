[package]
name = "monsoon"
version = "0.1.0"
edition = "2021"
description = "torrent client daemon and cli, built on libtorrent-rasterbar"

[dependencies]
cxx = "1.0"
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "6.0"
signal-hook = "0.3"
bytesize = "1.3"
humantime = "2.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
if-addrs = "0.13"

[build-dependencies]
cxx-build = "1.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.56.0"

[package.metadata.cargo-machete]
ignored = ["cxx-build"]
