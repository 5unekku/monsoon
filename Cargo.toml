[package]
name = "rustor"
version = "0.1.0"
edition = "2021"
description = "torrent client daemon and cli, built on libtorrent-rasterbar"

[dependencies]
cxx = "1.0"
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "6.0"
signal-hook = "0.3"
bytesize = "1.3"
humantime = "2.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cxx-build = "1.0"

[package.metadata.cargo-machete]
ignored = ["cxx-build"]
