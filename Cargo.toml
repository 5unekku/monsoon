[package]
name = "monsoon"
version = "0.1.0"
edition = "2021"
description = "torrent client daemon and cli, built on libtorrent-rasterbar"
license = "GPL-3.0-only"

[dependencies]
cxx = "1.0"
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "6.0"
signal-hook = "0.3"
bytesize = "1.3"
humantime = "2.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
# rustls + rcgen explicitly use ring instead of the default aws-lc-rs.
# aws-lc-sys is a cmake-built fork of libcrypto that's flaky to build in
# packaging environments (silent failures in aur chroots). ring is already
# in our dep tree, builds reliably with just cc, and gives us the same
# functionality. revisit if/when aws-lc-rs becomes the more stable option.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
if-addrs = "0.13"

[build-dependencies]
cxx-build = "1.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.56.0"

[package.metadata.cargo-machete]
ignored = ["cxx-build"]
