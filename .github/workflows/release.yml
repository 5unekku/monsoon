name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: rust:slim-trixie
    steps:
      - uses: actions/checkout@v6

      - name: apt deps
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            libtorrent-rasterbar-dev libcurl4-openssl-dev libssl-dev \
            libwayland-dev pkg-config build-essential dpkg-dev

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /usr/local/cargo/bin
          key: linux-cargo-tools-${{ hashFiles('Cargo.lock') }}

      - name: install packaging tools
        run: |
          command -v cargo-deb || cargo install cargo-deb --locked
          command -v cargo-generate-rpm || cargo install cargo-generate-rpm --locked

      - name: build
        run: cargo build --release

      - name: package deb
        run: cargo deb --no-build

      - name: package rpm
        run: cargo generate-rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-libtorrent-rasterbar
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ntldd

      - name: build
        shell: msys2 {0}
        run: cargo build --release

      - name: collect installer files
        shell: msys2 {0}
        run: |
          mkdir -p installer
          cp target/release/monsoon.exe installer/
          ntldd -R target/release/monsoon.exe \
            | awk '/\/mingw64\/bin\// { print $3 }' \
            | while IFS= read -r dll; do cp "$dll" installer/; done

      - name: portable zip
        run: Compress-Archive -Path installer\* -DestinationPath "monsoon-${{ github.ref_name }}-x86_64-windows-portable.zip"
        shell: powershell

      - name: build msi
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          # harvest bundled dlls into a wix fragment
          heat dir installer `
            -o wix\dlls.wxs `
            -cg DllFiles `
            -dr INSTALLFOLDER `
            -var var.InstallerDir `
            -gg -gl -scom -sreg -srd
          # compile + link
          candle -arch x64 `
            -dProductVersion="$version" `
            -dInstallerDir=installer `
            wix\main.wxs wix\dlls.wxs `
            -out wix\
          light wix\main.wixobj wix\dlls.wixobj `
            -ext WixUIExtension `
            -out "monsoon-$tag-x86_64-windows.msi"
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            monsoon-*-x86_64-windows-portable.zip
            monsoon-*-x86_64-windows.msi

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            artifacts/*.deb \
            artifacts/*.rpm \
            artifacts/monsoon-*-x86_64-windows-portable.zip \
            artifacts/monsoon-*-x86_64-windows.msi
